<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Meeting Automation</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f4f5f7; color: #1f2933; }
        h1 { font-size: 22px; margin: 0 0 4px; }
        p.subtitle { color: #6b7280; margin: 0 0 20px; font-size: 14px; }
        .statusline { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6b7280; margin-bottom: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; display: inline-block; }
        .dot.paused { background: #9ca3af; animation: none; }
        .dot { animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
        .section-title { font-size: 16px; font-weight: 600; margin: 28px 0 12px; }
        #container { display: flex; flex-direction: column; gap: 16px; max-width: 860px; }
        table.report { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.05); font-size: 14px; }
        table.report th, table.report td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #eef0f3; vertical-align: top; }
        table.report th { background: #f9fafb; color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
        table.report tr:last-child td { border-bottom: none; }
        tr.deleted-row td { background: #fef2f2; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .badge.created, .badge.approved { background: #dcfce7; color: #15803d; }
        .badge.deleted { background: #fee2e2; color: #b91c1c; }
        .badge.pending { background: #fef3c7; color: #b45309; }
        .badge.skipped { background: #f3f4f6; color: #6b7280; }
        .badge.error { background: #fee2e2; color: #b91c1c; }
        .badge.dismissed { background: #e0e7ff; color: #3730a3; }
        a.link { color: #2563eb; text-decoration: none; font-size: 13px; }
        a.link:hover { text-decoration: underline; }
        .sub { color: #9ca3af; font-size: 12px; }
        .deleted-note { color: #b91c1c; font-size: 12px; font-weight: 600; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .card h3 { margin: 0 0 12px; font-size: 15px; line-height: 1.4; }
        .card .meta { color: #9ca3af; font-size: 12px; margin-bottom: 12px; word-break: break-all; }
        .field { margin-bottom: 10px; }
        .field label { display: block; font-size: 12px; color: #4b5563; margin-bottom: 4px; }
        .field input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
        .actions { margin-top: 14px; display: flex; gap: 10px; }
        .btn { border: none; padding: 9px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-retry { background: #7c3aed; color: #fff; }
        .btn-retry:hover { background: #6d28d9; }
        .note { background: #fef3c7; border-left: 3px solid #f59e0b; color: #92400e; padding: 8px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 12px; }
        .status { margin-top: 10px; font-size: 13px; }
        .status.error { color: #dc2626; }
        .status.success { color: #16a34a; }
        #empty { color: #6b7280; font-size: 15px; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #d1d5db; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>Gmail Meeting Automation</h1>
    <p class="subtitle">Live monitor — new meeting emails are processed automatically; deleted calendar events are detected.</p>
    <div class="statusline"><span class="dot" id="liveDot"></span><span id="liveText">Connecting...</span></div>

    <div class="section-title">Incoming Emails</div>
    <div id="container">
        <table class="report" id="reportTable" style="display:none;">
            <thead><tr><th>Email</th><th>Status</th><th>Details</th></tr></thead>
            <tbody id="reportBody"></tbody>
        </table>
        <p id="emptyReport">Watching inbox for new emails...</p>
    </div>

    <div class="section-title">Manual Review Queue</div>
    <div id="pendingContainer"></div>

    <script>
        const body = document.getElementById('reportBody');
        const emptyReport = document.getElementById('emptyReport');
        const pendingContainer = document.getElementById('pendingContainer');
        const liveDot = document.getElementById('liveDot');
        const liveText = document.getElementById('liveText');
        const reportTable = document.getElementById('reportTable');

        const BADGES = {
            created: { text: 'Created', cls: 'created' },
            approved: { text: 'Created (Approved)', cls: 'approved' },
            deleted: { text: 'Deleted', cls: 'deleted' },
            pending: { text: 'Pending Review', cls: 'pending' },
            skipped: { text: 'Skipped', cls: 'skipped' },
            error: { text: 'Error', cls: 'error' },
            dismissed: { text: 'Dismissed', cls: 'dismissed' }
        };

        let lastScan = null;

        function fmtTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleString();
        }

        function renderLive(emails) {
            if (!emails || emails.length === 0) {
                reportTable.style.display = 'none';
                emptyReport.style.display = '';
                emptyReport.textContent = 'Waiting for emails to be processed...';
                return;
            }
            reportTable.style.display = '';
            emptyReport.style.display = 'none';
            body.innerHTML = emails.map(e => {
                const badge = BADGES[e.status] || { text: e.status, cls: 'skipped' };
                let detail = '';
                if (e.status === 'deleted') {
                    detail = `<span class="deleted-note">Deleted in Google Calendar${e.deleted_at ? ' at ' + fmtTime(e.deleted_at) : ''}</span>`;
                } else if (e.link) {
                    detail = `<a class="link" href="${escapeHtml(e.link)}" target="_blank">Open in Calendar &rarr;</a>`;
                } else if (e.reason) {
                    detail = `<span class="sub" title="${escapeHtml(e.reason)}">${escapeHtml(e.reason)}</span>`;
                }
                const m = e.meeting || {};
                const meetingInfo = m.meeting_title
                    ? `<br><span class="sub">${escapeHtml(m.meeting_title || '')}${m.date ? ' &middot; ' + escapeHtml(m.date) + (m.time ? ' ' + escapeHtml(m.time) : '') : ''}</span>`
                    : '';
                return `<tr class="${e.status === 'deleted' ? 'deleted-row' : ''}">
                    <td>${escapeHtml(e.subject || e.email_id)}<br><span class="sub">${escapeHtml(e.from || e.email_id)}</span><br><span class="sub">Processed ${fmtTime(e.processed_at)}</span>${meetingInfo}</td>
                    <td><span class="badge ${badge.cls}">${badge.text}</span></td>
                    <td>${detail}</td>
                </tr>`;
            }).join('');
        }

        async function refreshLive() {
            try {
                const res = await fetch('/live-status');
                if (!res.ok) throw new Error('failed');
                const data = await res.json();
                liveDot.className = 'dot';
                if (data.last_scan && data.last_scan !== lastScan) {
                    lastScan = data.last_scan;
                    liveText.textContent = 'Live — last scan ' + fmtTime(data.last_scan);
                } else if (!data.last_scan) {
                    liveText.textContent = 'Live — initial scan in progress...';
                }
                renderLive(data.emails);
            } catch {
                liveDot.className = 'dot paused';
                liveText.textContent = 'Server unreachable — retrying...';
            }
            alsoRefreshPending();
        }

        async function refreshPending() {
            try {
                const res = await fetch('/pending-meetings');
                if (!res.ok) throw new Error('failed');
                renderQueue(await res.json());
            } catch { /* keep current cards */ }
        }

        function alsoRefreshPending() { refreshPending(); }

        function renderQueue(meetings) {
            pendingContainer.innerHTML = '';
            if (!meetings || meetings.length === 0) {
                pendingContainer.innerHTML = '<p id="empty">No meetings pending review.</p>';
                return;
            }
            meetings.forEach(m => {
                const d = m.extracted_data || {};
                const isApiError = d.meeting_title === 'API Error - Needs Review';
                const errorNote = isApiError
                    ? '<div class="note">AI extraction failed: ' + escapeHtml(d.description || 'temporary API error') + '. Click "Re-run AI" to retry, or fill the details below and approve.</div>'
                    : '';
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3></h3>
                    <div class="meta">Email ID: ${m.email_id}</div>
                    ${errorNote}
                    <div class="field"><label>Title</label><input data-field="meeting_title" value="${escapeHtml(d.meeting_title || '')}"></div>
                    <div class="field"><label>Date (YYYY-MM-DD)</label><input data-field="date" value="${escapeHtml(d.date || '')}"></div>
                    <div class="field"><label>Time (HH:MM AM/PM)</label><input data-field="time" value="${escapeHtml(d.time || '')}"></div>
                    <div class="field"><label>Meet Link</label><input data-field="meet_link" value="${escapeHtml(d.meet_link || '')}"></div>
                    <div class="actions">
                        <button class="btn btn-primary">Approve</button>
                        <button class="btn btn-retry">Re-run AI</button>
                        <button class="btn btn-danger">Dismiss</button>
                    </div>
                    <div class="status"></div>
                `;
                card.querySelector('h3').textContent = m.subject;
                card.querySelector('.btn-primary').addEventListener('click', () => approve(m.email_id, card));
                card.querySelector('.btn-retry').addEventListener('click', () => retry(m.email_id, card));
                card.querySelector('.btn-danger').addEventListener('click', () => dismiss(m.email_id, card));
                pendingContainer.appendChild(card);
            });
        }

        async function approve(emailId, card) {
            const status = card.querySelector('.status');
            const btn = card.querySelector('.btn-primary');
            const payload = {};
            card.querySelectorAll('input[data-field]').forEach(input => {
                payload[input.dataset.field] = input.value.trim();
            });
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>';
            status.className = 'status';
            status.textContent = '';
            try {
                const res = await fetch('/approve-meeting/' + encodeURIComponent(emailId), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Approval failed');
                status.className = 'status success';
                status.textContent = 'Approved — event created';
                setTimeout(() => card.remove(), 800);
                if (!document.querySelector('.card')) {
                    pendingContainer.innerHTML = '<p id="empty">No meetings pending review.</p>';
                }
            } catch (err) {
                status.className = 'status error';
                status.textContent = err.message;
                btn.disabled = false;
                btn.textContent = 'Approve';
            }
        }

        async function dismiss(emailId, card) {
            try {
                const res = await fetch('/pending-meetings/' + encodeURIComponent(emailId), {
                    method: 'DELETE'
                });
                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || 'Dismiss failed');
                }
                card.remove();
                if (!document.querySelector('.card')) {
                    pendingContainer.innerHTML = '<p id="empty">No meetings pending review.</p>';
                }
            } catch (err) {
                const status = card.querySelector('.status');
                status.className = 'status error';
                status.textContent = err.message;
            }
        }

        async function retry(emailId, card) {
            const status = card.querySelector('.status');
            const btn = card.querySelector('.btn-retry');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>';
            status.className = 'status';
            status.textContent = '';
            try {
                const res = await fetch('/pending-meetings/' + encodeURIComponent(emailId) + '/retry', {
                    method: 'POST'
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Retry failed');
                status.className = 'status success';
                if (data.action === 'created') {
                    status.textContent = 'Extracted successfully - event created.';
                    setTimeout(() => card.remove(), 1000);
                } else {
                    status.textContent = 'Still needs review - fields updated from retry.';
                    btn.disabled = false;
                    btn.textContent = 'Re-run AI';
                    const d = data.extracted_data || {};
                    card.querySelector('input[data-field="meeting_title"]').value = d.meeting_title || '';
                    card.querySelector('input[data-field="date"]').value = d.date || '';
                    card.querySelector('input[data-field="time"]').value = d.time || '';
                    card.querySelector('input[data-field="meet_link"]').value = d.meet_link || '';
                }
            } catch (err) {
                status.className = 'status error';
                status.textContent = err.message;
                btn.disabled = false;
                btn.textContent = 'Re-run AI';
            }
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value;
            return div.innerHTML;
        }

        refreshLive();
        setInterval(refreshLive, 5000);
    </script>
</body>
</html>
